name: Vérifications
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m scripts.bootstrap --dev
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: pytest -q
      - run: python -m scripts.evaluate
      - run: python -m scripts.evaluate_workshop
      - run: python -m scripts.evaluate_rives
